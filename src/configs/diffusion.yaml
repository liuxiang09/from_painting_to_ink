seed: 42
device: cuda
image_size: 256
batch_size: 2
num_workers: 4
epochs: 100
lr: 0.0001
weight_decay: 0.0001
timesteps: 1000
save_every: 1
sample_every: 200
style_weight: 0.75
content_weight: 1.0
noise_weight: 1.0
paths:
  photo_train: data/landscape/train
  ink_train: data/ink/train
  photo_val: data/landscape/val
  ink_val: data/ink/val
  checkpoints: outputs/diffusion/checkpoints
  samples: outputs/diffusion/samples
