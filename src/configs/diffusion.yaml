seed: 42
device: cuda
image_size: 256
batch_size: 4
num_workers: 4
epochs: 100
lr: 0.00001
weight_decay: 0.0001
timesteps: 1000
timestep_min: 50
timestep_max: 700
save_every: 10
sample_every: 200
style_weight: 8.0
content_weight: 1.0
noise_weight: 1.0
augment: true
photo_color_jitter: 0.0
ink_color_jitter: 0.0
model:
  # Can be a Hugging Face repo id or a local official SD .ckpt/.safetensors file.
  pretrained_model: CompVis/stable-diffusion-v1-4
  train_unet: true
  train_vae: false
  tokens_per_image: 32
  fp16: true
paths:
  photo_train: data/landscape
  ink_train: data/ink/shui_mo
  checkpoints: outputs/diffusion/checkpoints
  samples: outputs/diffusion/samples
